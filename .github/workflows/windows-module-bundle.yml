name: Windows module bundle

on:
  pull_request:
    paths:
      - ".github/workflows/build-desktop.yml"
      - ".github/workflows/windows-module-bundle.yml"
      - "crates/openhuman-app/tauri.conf.json"
      - "crates/openhuman-core/src/modules/**"
      - "scripts/ci/self-hosted/test-module-assets.mjs"
      - "scripts/__tests__/stage-windows-modules.test.mjs"
      - "scripts/lib/module-pins.mjs"
      - "scripts/release/stage-windows-modules.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stage:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check registry coverage
        run: node --test scripts/__tests__/stage-windows-modules.test.mjs
      - name: Download and verify every bundled release
        run: node scripts/release/stage-windows-modules.mjs
